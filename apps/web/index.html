<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PROBE — autonomous AI-powered web application testing and investigation. Point it at a URL and a team of AI agents explores, investigates and reports."
    />
    <meta name="theme-color" content="#04070d" />
    <meta name="color-scheme" content="dark" />
    <!--
      Inline SVG favicon: no extra request, no 404 on /favicon.ico, and it stays
      crisp at 16px. A radar sweep — PROBE looking at your application.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080e17'/%3E%3Crect x='0.75' y='0.75' width='30.5' height='30.5' rx='6.5' fill='none' stroke='%2306b6d4' stroke-opacity='0.55' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2322d3ee' stroke-opacity='0.35' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%2322d3ee' stroke-opacity='0.55' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='1.9' fill='%2367e8f9'/%3E%3Cpath d='M16 16 L27 9' stroke='%2367e8f9' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>PROBE — Autonomous Web Testing</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown until React mounts, so the first paint is never a white flash. -->
    <style>
      html {
        background: #04070d;
      }
      #root:empty::after {
        content: "PROBE";
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #3a4d63;
        font: 600 13px/1 ui-monospace, monospace;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
